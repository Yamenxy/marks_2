<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel - Mr. Ahmed Mohie</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#071130,#092a4f);
  color:#e6eef9;
}

nav{
  display:flex;
  justify-content:space-between;
  padding:20px 50px;
  background:rgba(255,255,255,0.05);
  backdrop-filter:blur(10px);
}

.logo{
  font-weight:800;
  font-size:20px;
}

.nav-title{ font-weight:700; font-size:18px; color:#9be8ff; align-self:center; direction:rtl; }

.container{
  padding:40px;
  max-width:1000px;
  margin:30px auto;
  background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
  border-radius:14px;
  box-shadow: 0 10px 30px rgba(2,6,23,0.6);
}

input{
  padding:12px 14px;
  border-radius:10px;
  border:none;
  margin:10px 10px 10px 0;
  width:320px;
  background:rgba(255,255,255,0.03);
  color:inherit;
}

button{
  padding:10px 18px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#6c63ff,#00d4ff);
  color:white;
  cursor:pointer;
  font-weight:700;
  transition:transform .12s ease, box-shadow .12s ease;
}

button:active{ transform:translateY(1px); }

.loader{ width:48px; height:48px; border:6px solid rgba(255,255,255,0.08); border-top-color:#00d4ff; border-radius:50%; animation:spin 1s linear infinite; margin:18px auto; }
@keyframes spin{ to{ transform:rotate(360deg); } }

table{
  width:100%;
  margin-top:20px;
  border-collapse:collapse;
  background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
  border-radius:8px;
  overflow:hidden;
}

th,td{
  padding:10px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,0.1);
}

th{
  color:#9be8ff;
  font-weight:700;
}

.result-card{ padding:18px; background:rgba(0,0,0,0.12); border-radius:10px; }
/* responsive student card to avoid wide table */
.student-card{ padding:20px; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:10px; }
.student-header{ display:flex; gap:20px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
.student-meta{ color:#cfeffb; }
.marks-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:12px 20px; }
.mark-row{ display:flex; gap:12px; align-items:center; }
.mark-label{ width:45%; color:#9be8ff; font-weight:600; text-align:left; }
.mark-input input{ width:100%; padding:10px; border-radius:8px; border:none; background:rgba(255,255,255,0.03); color:inherit; }
@media(max-width:900px){
  .marks-grid{ grid-template-columns: 1fr; }
  .mark-label{ width:40%; }
}
</style>
</head>

<body>

<nav>
  <div class="logo">Mr. Ahmed Mohie - Admin</div>
  <div class="nav-title">الصف الاول الثانوي</div>
</nav>

<div class="container">

<h2>Student Marks Control</h2>

<input type="text" id="studentId" placeholder="Enter Student ID">
<button onclick="searchStudent()">Search</button>

<div id="result"></div>

<div id="loader" class="loader" style="display:none"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzptQHxNo5FHfiPu1n0J4sxka-5-KU5DtH2mSjIuzJeQstG-OhZ7UlvomlzhreP5pds/exec";

let headers = [];
let rows = [];
let lastMatches = [];
let lastLoadedAt = 0;

async function loadData(force = false, show = true){
  // avoid frequent fetches: use cached data unless forced or empty
  const now = Date.now();
  if(!force && rows && rows.length && (now - lastLoadedAt) < 60_000){
    return;
  }

  if(show) showLoader(true);
  try{
    const res = await fetch(API_URL + "?action=getData", {cache: 'no-store'});
    const data = await res.json();
    headers = data.headers || [];
    rows = data.rows || [];
    lastLoadedAt = Date.now();
  }catch(err){
    console.error(err);
  }finally{
    if(show) showLoader(false);
  }
}

// initial load
loadData(true, true);

// background refresh every 2 minutes (silent)
setInterval(()=> loadData(true, false), 120000);

// Enter key support for input
document.getElementById('studentId').addEventListener('keydown', function(e){
  if(e.key === 'Enter') searchStudent();
});

// debounce helper
function debounce(fn, wait){
  let t;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(()=> fn.apply(this, args), wait);
  };
}

// search wrapper called by button / enter key — debounced
const debouncedSearch = debounce(async function searchStudentImpl(){
  const query = document.getElementById("studentId").value.trim().toLowerCase();

  if(!query){
    document.getElementById("result").innerHTML = "";
    return;
  }

  // if we have no rows yet, fetch once (silent)
  if(!rows || !rows.length) await loadData(true, false);

  // find all matching rows (client-side filter)
  const matches = rows.filter(row => {
    return row && row.some(cell => {
      if(!cell) return false;
      const value = cell.toString().toLowerCase().trim();
      if(value === query) return true;
      if(value.length > 2 && value.substring(2) === query) return true;
      if(value.includes(query)) return true;
      return false;
    });
  });

  lastMatches = matches;

  if(matches.length === 0){
    document.getElementById("result").innerHTML = "<h3>Student Not Found</h3>";
    return;
  }

  if(matches.length === 1){
    renderStudent(matches[0]);
    return;
  }

  // multiple matches — show selectable list
  let html = `<h3>${matches.length} students found</h3>`;
  html += `<div class="result-card"><table><tr><th>${headers[0]||"ID"}</th><th>${headers[2]||"Name"}</th><th>Action</th></tr>`;
  matches.forEach((s,i)=>{
    const id = s[0]||"";
    const name = s[2]||s[1]||"";
    html += `<tr><td>${id}</td><td>${name}</td><td><button onclick="showStudentByIndex(${i})">View</button></td></tr>`;
  });
  html += `</table></div>`;
  document.getElementById("result").innerHTML = html;
}, 250);

function searchStudent(){ debouncedSearch(); }

function showStudentByIndex(i){ const student = lastMatches[i]; if(student) renderStudent(student); }

function renderStudent(student){
  // Compact responsive view: header + two-column grid of marks
  let html = `<div class="student-card">`;
  // header: show Name and ID (fallbacks)
  const nameLabel = headers[2] || 'Name';
  const idLabel = headers[0] || 'ID';
  const displayName = student[2] || student[1] || '';
  const idIndex = headers.findIndex(h => 
  h && (
    h.toString().toLowerCase().includes("رقم") ||
    h.toString().toLowerCase().includes("id") ||
    h.toString().toLowerCase().includes("code") ||
    h.toString().includes("كود")
  )
);

const displayId = idIndex !== -1 ? student[idIndex] : '';


  html += `<div class="student-header"><div class="student-meta"><div style="font-weight:700">${nameLabel}</div><div>${displayName}</div></div><div class="student-meta"><div style="font-weight:700">${idLabel}</div><div>${displayId}</div></div></div>`;

  html += `<div class="marks-grid">`;
  headers.forEach((h,i)=>{
    if(i<=2) return; // skip ID/name columns already shown
    const val = student[i] || '';
    html += `<div class="mark-row"><div class="mark-label">${h}</div><div class="mark-input"><input type="number" id="col_${i}" value="${val}"></div></div>`;
  });
  html += `</div>`;

  html += `<div style="margin-top:14px"><button id="saveBtn" onclick="saveMarks('${displayId}')">Save Changes</button></div>`;
  html += `</div>`;
  document.getElementById("result").innerHTML = html;
}



async function saveMarks(id){
  const saveBtn = document.getElementById('saveBtn');
  if(saveBtn) saveBtn.disabled = true;
  showLoader(true);

  let marks = {};
  headers.forEach((h,i)=>{
    if(i>2){
      const el = document.getElementById("col_"+i);
      if(el){ marks[h] = el.value; }
    }
  });

  try{
    // normalize id before sending
    const idTrim = (id || '').toString().trim();
    const numericId = idTrim.replace(/\D/g, '');
    const sendId = (numericId && numericId.length >= 5) ? numericId : idTrim;

    const payload = { action: "updateMarks", studentId: sendId, marks };
    console.log('update payload', payload);

    // send as form-encoded to avoid preflight CORS (Apps Script accepts form data)
    const form = new URLSearchParams();
    form.append('action', 'updateMarks');
    form.append('studentId', sendId);
    form.append('marks', JSON.stringify(marks));

    const res = await fetch(API_URL, { method: 'POST', body: form });

    const text = await res.text();
    let data = null;
    try{ data = JSON.parse(text); }catch(e){ /* not JSON */ }
    console.log('update response raw', text, 'status', res.status);

    if (data && data.status === 'success'){
      alert("Updated Successfully");
      await loadData(true, false);
    } else if (data && data.status === 'not found'){
      alert('Update failed: student not found');
    } else {
      // Show server response text for debugging
      alert('Update failed: ' + (text || ('HTTP ' + res.status)));
    }
  }catch(err){
    console.error(err);
    alert('Update failed');
  }finally{
    showLoader(false);
    if(saveBtn) saveBtn.disabled = false;
  }
}

function showLoader(on){
  const el = document.getElementById('loader');
  if(!el) return;
  el.style.display = on ? 'block' : 'none';
}
</script>

</body>
</html>
